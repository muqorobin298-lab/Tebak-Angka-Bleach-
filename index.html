<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tebak Angka Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #38d4ff; --spark: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #050510; color: #f5f5f5;
      min-height: 100vh; display: flex;
      justify-content: center; align-items: flex-start;
      padding: 40px 20px; overflow-x: hidden;
    }
    #scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
    .layer.aktif { opacity: 1; }
    .kanji {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 45vw; font-weight: 900; color: #fff; opacity: 0.06; white-space: nowrap;
    }
    .orb { position: absolute; top: 9%; right: 10%; width: clamp(120px, 22vw, 260px); aspect-ratio: 1; border-radius: 50%; }
    .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 36vh; }
    #sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -10px; border-radius: 50%;
      background: var(--spark); box-shadow: 0 0 8px var(--spark);
      opacity: 0; animation: naik linear infinite;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    .box {
      position: relative; z-index: 1;
      background: rgba(8,8,18,0.85); backdrop-filter: blur(4px);
      border-left: 8px solid var(--accent);
      width: 100%; max-width: 480px; padding: 28px 24px;
      transition: border-color 1s;
    }
    h1 { font-family: 'Anton', Impact, sans-serif; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; }
    h1 span { color: var(--accent); transition: color 1s; }
    .lokasi {
      font-family: 'Anton', Impact, sans-serif; letter-spacing: 3px; font-size: 13px;
      color: var(--accent); margin: 2px 0 14px; text-transform: uppercase; transition: color 1s;
    }
    .aturan { font-size: 14px; line-height: 1.6; opacity: 0.85; margin-bottom: 16px; }
    .info { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; }
    .meter { height: 12px; background: rgba(255,255,255,0.15); margin-bottom: 6px; }
    .meter i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width 0.5s, background 1s; }
    .petunjuk { min-height: 52px; font-size: 18px; line-height: 1.4; margin: 12px 0; }
    .tebak { display: flex; gap: 8px; margin-bottom: 14px; }
    input {
      flex: 1; font-family: 'Anton', Impact, sans-serif; font-size: 24px; text-align: center; padding: 10px;
      background: rgba(255,255,255,0.08); border: 2px solid #f5f5f5; color: #fff; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      font-family: 'Anton', Impact, sans-serif; font-size: 18px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--accent); color: #000; border: none; padding: 0 22px; cursor: pointer; transition: background 1s;
    }
    .btn:hover { background: #fff; }
    .riwayat { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; margin-bottom: 14px; }
    .chip { padding: 6px 12px; font-size: 14px; background: rgba(255,255,255,0.1); border-left: 3px solid var(--accent); }
    .skor { font-size: 12px; letter-spacing: 2px; opacity: 0.7; margin-top: 6px; }
    .hidden { display: none; }
    #bankai {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(60px, 16vw, 160px); letter-spacing: 6px; color: #ffd400;
      text-shadow: 0 0 30px #ff3d00, 0 0 70px #ff3d00;
      z-index: 5; opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #bankai.muncul { animation: bankai 2s ease forwards; }
    @keyframes bankai {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
  
    /* ===== TOMBOL KEMBALI KE MENU AWAL (PORTOFOLIO ROBIN) ===== */
    .menu-robin {
      position: fixed; left: 14px; bottom: 14px; z-index: 50;
      font-family: 'Anton', Impact, sans-serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none; color: #f5f5f5;
      background: rgba(8,8,18,0.85); border: 2px solid #f5f5f5;
      padding: 8px 14px; transition: all 0.2s;
    }
    .menu-robin:hover { background: #f5f5f5; color: #000; transform: translateY(-2px); }
    body { padding-bottom: 64px !important; }
  </style>
</head>
<body>
  <a class="menu-robin" href="https://muqorobin298-lab.github.io/Robin_Dev/">← Menu Awal</a>

  <div id="scene"></div>
  <div id="sparks"></div>
  <div id="bankai">BANKAI!</div>

  <div class="box">
    <h1>Tebak <span>Angka</span></h1>
    <p class="lokasi" id="lokasi"></p>
    <p class="aturan">Aku menyimpan angka 1 sampai 100. Kamu punya 7 kesempatan. Makin dekat tebakanmu, makin panas reiatsu-nya.</p>

    <div class="info"><span id="sisa"></span><span id="status"></span></div>
    <div class="meter"><i id="meter"></i></div>
    <p class="petunjuk" id="petunjuk">Tebakan pertamamu?</p>

    <div class="tebak">
      <input id="input" type="number" min="1" max="100" placeholder="1-100">
      <button class="btn" id="tebakBtn">Tebak</button>
    </div>
    <div class="riwayat" id="riwayat"></div>
    <button class="btn hidden" id="ulang" style="padding:12px 26px">Main Lagi</button>
    <p class="skor" id="skor"></p>
  </div>

  <script>
    const tema = {
      jauh:    { nama: "Istana Es", kanji: "氷", g: "linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%)", orb: "radial-gradient(circle,#ffffff 0%,#e0f7ff 70%,#9fe3ff 100%)", glow: "#aeeaff", city: "#04182e", accent: "#38d4ff", spark: "#ffffff" },
      sedang:  { nama: "Malam Bersalju", kanji: "月", g: "linear-gradient(to top,#2a4a7a,#10234a 50%,#030818 100%)", orb: "radial-gradient(circle,#ffffff 0%,#dbeafe 70%,#a5c8ff 100%)", glow: "#bcd8ff", city: "#050b1a", accent: "#4da6ff", spark: "#d6e8ff" },
      dekat:   { nama: "Senja Karakura", kanji: "代行", g: "linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%)", orb: "radial-gradient(circle,#fff3c4 0%,#ffd27a 60%,#ff9a3c 100%)", glow: "#ffb347", city: "#1a0a12", accent: "#ff6a00", spark: "#ffcf8a" },
      panas:   { nama: "BANKAI!", kanji: "卍解", g: "linear-gradient(to top,#ff7b3d,#7a0b1b 45%,#2b0008 100%)", orb: "radial-gradient(circle,#fffbe0 0%,#ffe9b0 60%,#ffd400 100%)", glow: "#ffd400", city: "#1a0004", accent: "#ffd400", spark: "#ffe28a" },
      menang:  { nama: "Hujan Sakura", kanji: "桜", g: "linear-gradient(to top,#ff9ec4,#a8326b 45%,#2a0b2e 100%)", orb: "radial-gradient(circle,#fff0f6 0%,#ffc2da 70%,#ff8fba 100%)", glow: "#ffb3d1", city: "#1f0720", accent: "#ff5c9e", spark: "#ffd0e3" },
      kalah:   { nama: "Soul Society", kanji: "死神", g: "linear-gradient(to top,#3b1d5e,#1a1040 45%,#050510 100%)", orb: "radial-gradient(circle,#fff6dc 0%,#fff1d0 70%,#ffe2a0 100%)", glow: "#fff1d0", city: "#000000", accent: "#a855f7", spark: "#e0c8ff" }
    };
    const urutan = Object.keys(tema);

    const kota = `<svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="CITYCOLOR">
      <rect x="0" y="270" width="1200" height="30"/>
      <path d="M90 270 V190 H130 V270 Z"/><path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/><path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/><path d="M95 150 L110 125 L125 150 Z"/>
      <path d="M200 270 V215 H420 V270 Z"/><path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <path d="M520 270 V160 H580 V270 Z"/><path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/><path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/><path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/><path d="M540 82 L550 50 L560 82 Z"/>
      <path d="M680 270 V220 H860 V270 Z"/><path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <path d="M930 270 V185 H980 V270 Z"/><path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/><path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/><path d="M938 140 L955 112 L972 140 Z"/>
      <path d="M1060 270 V225 H1200 V270 Z"/><path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>`;

    const scene = document.getElementById("scene");
    const layers = {};
    urutan.forEach(k => {
      const t = tema[k];
      const d = document.createElement("div");
      d.className = "layer";
      d.style.background = t.g;
      d.innerHTML =
        '<div class="kanji">' + t.kanji + '</div>' +
        '<div class="orb" style="background:' + t.orb + ';box-shadow:0 0 40px ' + t.glow + ',0 0 110px ' + t.glow + '"></div>' +
        kota.replace("CITYCOLOR", t.city);
      scene.appendChild(d);
      layers[k] = d;
    });

    const sparks = document.getElementById("sparks");
    for (let n = 0; n < 35; n++) {
      const s = document.createElement("div");
      s.className = "spark";
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 10) + "s";
      sparks.appendChild(s);
    }

    function gantiTema(k) {
      const t = tema[k];
      urutan.forEach(n => layers[n].classList.toggle("aktif", n === k));
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--spark", t.spark);
      document.getElementById("lokasi").textContent = "// " + t.nama;
    }

    // ===== LOGIKA GAME =====
    const $ = id => document.getElementById(id);
    const MAKS = 7;
    let rahasia, sisa, tebakan, selesai, terbaik = null;

    try { terbaik = JSON.parse(localStorage.getItem("tebakAngkaTerbaik")); } catch (e) { terbaik = null; }

    function tampilSkor() {
      $("skor").textContent = terbaik ? "REKOR: MENANG DALAM " + terbaik + " TEBAKAN" : "";
    }

    function mulai() {
      rahasia = Math.floor(Math.random() * 100) + 1;
      sisa = MAKS; tebakan = []; selesai = false;
      $("sisa").textContent = "SISA " + sisa;
      $("status").textContent = "";
      $("meter").style.width = "0%";
      $("petunjuk").textContent = "Tebakan pertamamu?";
      $("riwayat").innerHTML = "";
      $("input").value = ""; $("input").disabled = false; $("tebakBtn").disabled = false;
      $("ulang").classList.add("hidden");
      gantiTema("jauh");
      tampilSkor();
      $("input").focus();
    }

    function tebak() {
      if (selesai) return;
      const n = parseInt($("input").value, 10);
      if (isNaN(n) || n < 1 || n > 100) { $("petunjuk").textContent = "Masukkan angka antara 1 dan 100."; return; }
      if (tebakan.includes(n)) { $("petunjuk").textContent = "Angka " + n + " sudah pernah kamu tebak."; return; }

      tebakan.push(n);
      sisa--;
      $("sisa").textContent = "SISA " + sisa;
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = n;
      $("riwayat").appendChild(chip);
      $("input").value = "";

      const jarak = Math.abs(n - rahasia);
      const kekuatan = Math.max(0, 100 - jarak * 2);
      $("meter").style.width = kekuatan + "%";

      if (n === rahasia) return menang();

      let kunci, label;
      if (jarak <= 5) { kunci = "panas"; label = "Reiatsu menggila!"; }
      else if (jarak <= 15) { kunci = "dekat"; label = "Hangat, sudah dekat."; }
      else if (jarak <= 35) { kunci = "sedang"; label = "Masih agak dingin."; }
      else { kunci = "jauh"; label = "Dingin sekali, jauh."; }

      const arah = n < rahasia ? "Terlalu kecil, coba lebih besar." : "Terlalu besar, coba lebih kecil.";
      $("petunjuk").textContent = arah + " " + label;
      $("status").textContent = tema[kunci].nama.toUpperCase();
      gantiTema(kunci);

      if (sisa === 0) kalah();
    }

    function menang() {
      selesai = true;
      const pakai = tebakan.length;
      $("petunjuk").textContent = "Benar! Angkanya " + rahasia + ". Kamu menang dalam " + pakai + " tebakan.";
      $("status").textContent = "MENANG";
      $("meter").style.width = "100%";
      gantiTema("menang");
      const b = $("bankai");
      b.classList.remove("muncul"); void b.offsetWidth; b.classList.add("muncul");
      if (terbaik === null || pakai < terbaik) {
        terbaik = pakai;
        try { localStorage.setItem("tebakAngkaTerbaik", JSON.stringify(terbaik)); } catch (e) {}
      }
      tampilSkor();
      akhiri();
    }

    function kalah() {
      selesai = true;
      $("petunjuk").textContent = "Kesempatan habis. Angkanya adalah " + rahasia + ".";
      $("status").textContent = "KALAH";
      gantiTema("kalah");
      akhiri();
    }

    function akhiri() {
      $("input").disabled = true;
      $("tebakBtn").disabled = true;
      $("ulang").classList.remove("hidden");
    }

    $("tebakBtn").onclick = tebak;
    $("input").addEventListener("keydown", e => { if (e.key === "Enter") tebak(); });
    $("ulang").onclick = mulai;

    mulai();
  </script>
</body>
</html>
